known_strengths:
- Stage-B fault-group localization transfers very strongly from simulation to measurement.
- Stage-A MLP preserves strong measured-domain ranking ability despite severe probability
  shift.
- Measured threshold calibration substantially recovers HEALTHY and FAULT recall.
- Unseen-SpeedRef simulation robustness reached perfect hierarchical performance.
known_limitations:
- Stage-A held-out Macro F1 did not meet the predefined 0.80 deployment-acceptance
  criterion.
- Stage-A requires measured-domain threshold calibration; the simulation-derived 0.5
  threshold does not transfer.
- Measured-domain deployment development occurred after TEST-001 had already exposed
  the full measured dataset.
- Model validation is limited to the public PMSM dataset used in P02.
- Fault groups are retained as GROUP_1/GROUP_2/GROUP_3 rather than asserted physical
  U/V/W phase names.
- Fault severity is not predicted.
- Inputs are RMS-domain features plus speed, not raw time-domain waveforms.
intended_use: Portfolio engineering demonstration and diagnostic-support prototype.
not_intended_for: Safety-critical production decisions without additional independent
  validation.
further_model_search: false
