representation_role:
  RAW_7: raw frozen predictor baseline
  ENGINEERED_14: physics-guided engineered representation
  COMBINED_20: raw plus physics-guided representation
imbalance_definition:
  formula: max(abs(I_phase - mean_phase)) / max(mean_phase, epsilon)
  standards_claim: false
  interpretation: engineering phase-RMS imbalance index
cross_subsystem_difference_policy:
  signed_difference: true
  absolute_difference: true
cross_subsystem_ratio_policy:
  representation: natural_log_ratio
  formula: ln((I_sub1 + epsilon)/(I_sub2 + epsilon))
  zero_meaning: matched corresponding-phase RMS
  sign_preserved: true
scaling_policy:
  feature_calculation_before_scaling: true
  scaler_fit_partition: SIM_TRAIN
  validation_uses_train_fitted_scaler: true
  measured_test_uses_train_fitted_scaler: true
  domain_specific_scalers: false
feature_selection_policy:
  supervised_pruning_before_baseline: false
  measured_test_used_for_pruning: false
  all_13_derived_features_retained: true
  train_only_redundancy_audit_pair_count: 1
